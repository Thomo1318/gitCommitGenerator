description: Git Commit Generator - MTPLX Evaluation
prompts:
- 'Write a short commit message for the following diff: {{diff}}'
providers:
- id: openai:chat:MTPLX
  config:
    apiBaseUrl: http://localhost:8000/v1
    apiKey: dummy
redteam:
  plugins:
  - hijacking
  - indirect-prompt-injection
  - pii:direct
tests:
- description: 'smoke: conventional subject length + hybrid header shape'
  vars:
    diff: |-
      diff --git a/file.txt b/file.txt
      --- a/file.txt
      +++ b/file.txt
      @@ -1 +1 @@
      -old line
      +new line
  assert:
  - type: javascript
    value: output.trim().length > 5 && output.trim().length <= 72
  - type: javascript
    value: '/^[\p{Emoji_Presentation}\p{Extended_Pictographic}\u200d\uFE0F]+\s[a-z_]+(\([^)]+\))?!?: .+$/u.test(output.trim())'
- description: '#204 Slice9 A/TIP-G2: fixtures README authority/auth prose → test/NONE; reject security'
  vars:
    letter: A
    case_id: TIP-G2
    staged_paths:
    - tests/fixtures/scoped_history/README.md
    diff: |-
      diff --git a/tests/fixtures/scoped_history/README.md b/tests/fixtures/scoped_history/README.md
      --- a/tests/fixtures/scoped_history/README.md
      +++ b/tests/fixtures/scoped_history/README.md
      @@ -1,1 +1,3 @@
       baseline 0
      +TIP-G2 letter A path tests/fixtures/scoped_history/README.md
      +Document fixture authority matrix and local auth flows.
  assert:
  - type: javascript
    value: output.trim().length > 5 && output.trim().length <= 72
  - type: javascript
    value: '/^[\p{Emoji_Presentation}\p{Extended_Pictographic}\u200d\uFE0F]+\s[a-z_]+(\([^)]+\))?!?: .+$/u.test(output.trim())'
  - type: javascript
    value: output.includes('test(') || /\stest:/.test(output) || output.includes('test:')
  - type: javascript
    value: '!output.includes("\ud83d\udd10")'
  - type: javascript
    value: '!(output.includes(''feat('') || /\sfeat:/.test(output) || output.includes(''feat:''))'
  - type: javascript
    value: '!(output.includes(''fix('') || /\sfix:/.test(output) || output.includes(''fix:''))'
  - type: javascript
    value: '!output.toLowerCase().includes(''secrets'')'
  - type: javascript
    value: '!output.toLowerCase().includes(''credentials'')'
  - type: javascript
    value: '!output.toLowerCase().includes(''security'')'
- description: '#204 Slice9 B/TIP-G3: ADR status + index → docs(adr)/NONE; reject chore/Security'
  vars:
