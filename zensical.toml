[project]
site_name = "gitCommitGenerator Documentation"
site_description = "AI-powered automated git commit generator"
use_directory_urls = false
extra_javascript = [
    "https://unpkg.com/tablesort@5.7.1/dist/tablesort.min.js",
    "javascripts/tablesort-init.js",
]
extra_css = [
    "stylesheets/tablesort.css",
    "stylesheets/custom.css"
]

nav = [
    { "Home" = "index.md" },
    { "Usage" = "usage.md" },
    { "CLI" = [
        { "Overview" = "cli/index.md" },
        { "git-cg commit" = "cli/commit.md" },
        { "git-cg preflight" = "cli/preflight.md" },
        { "git-cg sop" = "cli/sop.md" },
        { "git-cg release" = "cli/release.md" },
        { "git-cg record-telemetry" = "cli/record-telemetry.md" },
        { "git-cg evals" = "cli/evals.md" },
        { "git-cg eval" = "cli/eval.md" },
        { "Eval harness" = [
            { "Overview" = "cli/eval/index.md" },
            { "run" = "cli/eval/run.md" },
            { "resume" = "cli/eval/resume.md" },
            { "recompute-scores" = "cli/eval/recompute-scores.md" },
            { "doctor" = "cli/eval/doctor.md" },
            { "amend-brief" = "cli/eval/amend-brief.md" },
            { "dogfood (dark-launch)" = "cli/eval/dogfood.md" },
            { "train-export" = "cli/eval/train-export.md" },
            { "triage" = "cli/eval/triage.md" },
            { "failures" = "cli/eval/failures.md" },
            { "explain" = "cli/eval/explain.md" },
            { "compare" = "cli/eval/compare.md" },
            { "replay" = "cli/eval/replay.md" },
            { "promote" = "cli/eval/promote.md" },
            { "diagnose" = "cli/eval/diagnose.md" },
            { "materialize-core-goldens" = "cli/eval/materialize-core-goldens.md" },
            { "encode-fixture" = "cli/eval/encode-fixture.md" },
            { "export" = [
                { "Overview" = "cli/eval/export.md" },
                { "status" = "cli/eval/export/status.md" },
                { "retry" = "cli/eval/export/retry.md" },
                { "drain" = "cli/eval/export/drain.md" },
            ] },
            { "review" = [
                { "Overview" = "cli/eval/review.md" },
                { "enqueue" = "cli/eval/review/enqueue.md" },
                { "list" = "cli/eval/review/list.md" },
                { "show" = "cli/eval/review/show.md" },
                { "claim" = "cli/eval/review/claim.md" },
                { "adjudicate" = "cli/eval/review/adjudicate.md" },
                { "dismiss" = "cli/eval/review/dismiss.md" },
                { "rollup" = "cli/eval/review/rollup.md" },
            ] },
            { "session" = [
                { "Overview" = "cli/eval/session.md" },
                { "show" = "cli/eval/session/show.md" },
            ] },
            { "thread" = [
                { "Overview" = "cli/eval/thread.md" },
                { "show" = "cli/eval/thread/show.md" },
            ] },
            { "issue" = [
                { "Overview" = "cli/eval/issue.md" },
                { "list" = "cli/eval/issue/list.md" },
                { "show" = "cli/eval/issue/show.md" },
                { "resolve" = "cli/eval/issue/resolve.md" },
                { "reopen" = "cli/eval/issue/reopen.md" },
                { "suppress" = "cli/eval/issue/suppress.md" },
            ] },
            { "opik" = [
                { "Overview" = "cli/eval/opik.md" },
                { "doctor" = "cli/eval/opik/doctor.md" },
                { "config show" = "cli/eval/opik/config/show.md" },
            ] },
            { "Deprecated aliases" = [
                { "config" = "cli/eval/config.md" },
                { "export-status" = "cli/eval/export-status.md" },
                { "export-retry" = "cli/eval/export-retry.md" },
                { "export-drain" = "cli/eval/export-drain.md" },
            ] },
        ] },
    ] },
    { "Developer" = "DEVELOPMENT.md" },
    { "Changelog" = "CHANGELOG.md" },
    { "Internal Governance" = [
        { "Decision Matrix" = "ADRs/0000-decision-matrix.md" },
        { "ADR-0001: Adopt ADR Ecosystem" = "ADRs/0001-adopt-adr-ecosystem.md" },
        { "ADR-0002: Adopt Gitleaks and Trufflehog" = "ADRs/0002-adopt-gitleaks-and-trufflehog.md" },
        { "ADR-0003: Adopt FNOX for Secrets" = "ADRs/0003-adopt-fnox-for-secrets-management.md" },
        { "ADR-0004: 1Password Service Account" = "ADRs/0004-1password-service-account-integration.md" },
        { "ADR-0006: 1Password SDK Migration" = "ADRs/0006-1password-python-sdk-migration.md" },
        { "ADR-0007: Gum TUI Integration" = "ADRs/0007-Integrate-gum-for-terminalnative-git-hook-tui.md" },
        { "ADR-0008: Zensical Integration" = "ADRs/0008-zensical-integration.md" },
        { "ADR-0009: Guided Regeneration" = "ADRs/0009-reconcile-deterministic-intent-ranking-with-guided-regeneration.md" },
        { "ADR-0010: Integrate Opik Telemetry Pipeline" = "ADRs/0010-integrate-opik-telemetry-pipeline.md" },
        { "ADR-0011: E2E Observability Stack" = "ADRs/0011-e2e-observability-stack.md" },
        { "ADR-0012: Adopt CodeRabbit and Qodo" = "ADRs/0012-adopt-coderabbit-and-qodo.md" },
        { "ADR-0013: Formalise IDE Boundaries for Local Env" = "ADRs/0013-formalise-ide-boundaries-for-1password-mounted-local-env-files.md" },
    ] },
]

[project.theme]
variant = "modern"
primary = "indigo"
accent = "cyan"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"

features = [
    "navigation.tabs",
    "navigation.top",
    "search.suggest",
    "search.highlight",
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
