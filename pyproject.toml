[project]
name = "gitcommitgenerator"
version = "0.23.0"
description = "Terminal native agentic gitops workflow utilizing gum"
readme = "README.md"
requires-python = ">=3.14, <4.0"
dependencies = [
  "code-review-graph>=2.3.7",
  "hf-transfer>=0.1.9",
  "httpx>=0.28.0",
  "instructor>=1.15.1",
  "jsonschema>=4.26.0",
  "mlx-lm>=0.31.3",
  "onepassword-sdk>=0.1.2",
  "openai>=2.38.0",
  "opik>=2.0.52",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "rapidfuzz>=3.0.0",
  "reportlab>=5.0.0",
  "rich>=14.3.4,<16",
  "semver>=3.0.4",
  "sentry-sdk>=2.61.0",
  "tenacity>=9.1.2",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-language-pack>=0.13,<1",
  "typer>=0.26.3",
]

[project.scripts]
git-cg = "git_cg.main:app"

[dependency-groups]
dev = [
  "harbor>=0.22.0",
  "matplotlib>=3.11.1",
  "pytest>=9",
  "pytest-cov>=7",
  "ruff>=0.15.15",
]
docs = ["markdown>=3.7", "pymdown-extensions>=10.14", "zensical>=0.0.45"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["src/git_cg", "scripts"]
omit = [
  "src/git_cg/evals/*",
  "scripts/eval_commit_message.py",
  "scripts/opik_metrics.py",
  "scripts/opik_trace_triage.py",
  "scripts/setup_opik_eval_rule.py",
  "scripts/setup_opik_test_suites.py",
  "scripts/sync_promptfoo_to_opik.py",
  "scripts/sync_prompts_to_opik.py",
  "scripts/test_generation.py",
  "scripts/setup_test_scenario.zsh",
  "scripts/with_1p_env.sh",
  "scripts/*.mjs",
  "scripts/*.kdl",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
packages = ["src/git_cg"]

# Ship the SOP as package data so the tool works as a global hook in ANY repo.
# Repo-root `config/` remains canonical (used by dev CLI + the Node gatekeeper);
# this just copies it into the wheel under `git_cg/data/` at build time.
[tool.hatch.build.targets.wheel.force-include]
"config/gitops_agent_sop.json" = "git_cg/data/gitops_agent_sop.json"
"config/gitops_sop.schema.json" = "git_cg/data/gitops_sop.schema.json"

[tool.pyright]
extraPaths = ["src", "scripts"]

[tool.pytest.ini_options]
addopts = "--cov=src/git_cg --cov=scripts --cov-branch --cov-report=term-missing:skip-covered"
python_files = "test_*.py"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = ["**/.libs/**", "**/libs/**"]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify, RUF: ruff, N: pep8-naming
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N"]

# B008: Do not perform function calls in argument defaults (Must ignore for Typer.Option / Pydantic.Field)
# E501: Line too long (Handled by the formatter)
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["git_cg"]
known-third-party = ["opik"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# Security / SBOM floor pins for transitive deps (Grype --fail-on high).
# pillow via reportlab; aiohttp via instructor/litellm; cryptography transitive;
# pymdown-extensions via docs extra; pydantic-settings via opik/mcp.
[tool.interrogate]
# Docstring coverage (interrogate) for first-party package surface.
#
# Runtime pin (mandatory): Python 3.14+.
# This codebase uses PEP 758 bare multi-except (`except A, B:`). interrogate on
# 3.13- parses that as SyntaxError. Always invoke via:
#   uvx --python 3.14 interrogate …
#
# CI gate is PATCH-SCOPED (changed files under src/git_cg only), fail-under 80.
# Full-tree `src/git_cg` scans generate the README badge only (informational in CI).
# Legacy soak/dashboard scripts are excluded from package-wide scans.
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-nested-classes = true
ignore-semiprivate = false
ignore-private = false
ignore-module = false
fail-under = 80
exclude = ["src/git_cg/evals"]
verbose = 1
quiet = false
color = true
omit-covered-files = false


[tool.uv]
constraint-dependencies = [
  "pillow>=12.3.0",
  "aiohttp>=3.14.3",
  "cryptography>=50.0.0",
  "pymdown-extensions>=11.0.0",
  "pydantic-settings>=2.14.2",
]
