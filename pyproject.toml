[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gitcommitgenerator"
version = "0.1.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "instructor>=1.15.1",
    "onepassword-sdk>=0.1.2",
    "openai>=2.38.0",
    "opik>=2.0.52",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "rich>=14.3.4",
    "typer>=0.26.3",
]

[project.scripts]
git-cg = "git_cg.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/git_cg"]

# Ship the SOP as package data so the tool works as a global hook in ANY repo.
# Repo-root `config/` remains canonical (used by dev CLI + the Node gatekeeper);
# this just copies it into the wheel under `git_cg/data/` at build time.
[tool.hatch.build.targets.wheel.force-include]
"config/gitops_agent_sop.json" = "git_cg/data/gitops_agent_sop.json"
"config/gitops_sop.schema.json" = "git_cg/data/gitops_sop.schema.json"

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify, RUF: ruff, N: pep8-naming
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "N"]

# B008: Do not perform function calls in argument defaults (Must ignore for Typer.Option / Pydantic.Field)
# E501: Line too long (Handled by the formatter)
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = ["ruff>=0.15.15", "pytest>=8.0.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src/git_cg --cov-report=term-missing"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15
