name: Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/ref while keeping unique run_id fallback.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Deep Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so PR/push base SHAs resolve for ranged scans.
          fetch-depth: 0

      - name: TruffleHog OSS
        # trufflesecurity/trufflehog@v3.95.9 (action SHA + scanner version pin)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          # Per-event ranges:
          # - pull_request: base.sha .. head.sha
          # - push: before .. sha (empty base on all-zero initial push)
          # - workflow_dispatch: empty base, head = github.sha (full-history checkout)
          base: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || (
                github.event_name == 'push'
                && github.event.before != '0000000000000000000000000000000000000000'
                && github.event.before
                || ''
              )
            }}
          head: >-
            ${{
              github.event_name == 'pull_request'
              && github.event.pull_request.head.sha
              || github.sha
            }}
          version: "3.95.9"
          extra_args: --only-verified

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        # jdx/mise-action@v4.2.1 — installs exact syft/grype/grant from mise.toml
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          install: true
          cache: true

      - name: Verify SBOM tool versions
        run: |
          set -euo pipefail
          echo "syft: $(syft version 2>/dev/null || syft --version)"
          echo "grype: $(grype version 2>/dev/null || grype --version)"
          echo "grant: $(grant version 2>/dev/null || grant --version)"
          (syft version 2>/dev/null || syft --version) | grep -F "1.48.0"
          (grype version 2>/dev/null || grype --version) | grep -F "0.116.0"
          (grant version 2>/dev/null || grant --version) | grep -F "0.6.8"

      - name: Generate SBOMs (Syft)
        run: |
          set -euo pipefail
          syft . -o cyclonedx-json=bom.json
          syft . -o syft-json=bom.syft.json

      - name: Upload SBOM Artifact
        # Only skip when running under nektos/act (ACT=true). Do not set ACT=false.
        if: ${{ env.ACT != 'true' }}
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cyclone-dx-sbom
          path: bom.json

      - name: License Compliance (Grant)
        run: grant check bom.syft.json --dry-run

      - name: Vulnerability Scan (Grype)
        run: grype sbom:bom.json --fail-on high
