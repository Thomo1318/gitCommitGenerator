name: CI / Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/ref while keeping unique run_id fallback.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: hk validate & check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # hk check --pr diffs DEFAULT_BRANCH..HEAD; ensure origin/<base> exists under
      # persist-credentials: false (checkout does not keep a token for later fetches).
      - name: Fetch PR base branch for hk --pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # checkout has persist-credentials: false — use the job token for this fetch only.
          # github.* expressions are injected via env (not embedded in the shell script body).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git remote set-url origin "https://github.com/${REPO}.git"
          # hk --pr resolves DEFAULT_BRANCH (often bare "main"); create a local ref.
          if ! git show-ref --verify --quiet "refs/heads/${BASE_REF}"; then
            git branch --force "${BASE_REF}" "origin/${BASE_REF}"
          fi
          git rev-parse --verify "origin/${BASE_REF}"
          git rev-parse --verify "${BASE_REF}"

      - name: Install mise tools
        # jdx/mise-action@v4.2.1 — exact hk pin from mise.toml
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          install: true
          cache: true

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # ruff comes from the project env (used by hk steps).
        run: uv sync --all-extras --dev

      - name: hk validate
        run: hk validate

      - name: hk check (pull_request)
        if: github.event_name == 'pull_request'
        env:
          # Defence in depth: never run slow cov, secrets scanner, or mutating doc gens in CI lint.
          HK_SKIP_STEPS: pytest-cov,betterleaks,gen-docs,gen-toc
        run: >-
          hk check
          --check
          --no-stage
          --pr
          --fail-fast
          --no-progress

      - name: hk check (push / workflow_dispatch)
        if: github.event_name != 'pull_request'
        env:
          HK_SKIP_STEPS: pytest-cov,betterleaks,gen-docs,gen-toc
        # Do not use --pr alone on push/dispatch (can become a no-op delta).
        run: >-
          hk check
          --check
          --no-stage
          --all
          --fail-fast
          --no-progress

  test-and-coverage:
    name: Run Tests
    runs-on: ubuntu-latest
    # Tests only — no OIDC. Fork PR code never receives id-token: write.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate codecov.yml
        run: |
          set -euo pipefail
          # Codecov YAML validator (non-secret). Fail the job on invalid config.
          response="$(
            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              --data-binary @codecov.yml \
              https://codecov.io/validate
          )"
          printf '%s\n' "${response}"
          printf '%s\n' "${response}" | grep -qi 'Valid!'

      - name: Run Tests with Coverage
        run: >
          uv run pytest
          --cov=src/git_cg
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing:skip-covered

      - name: Upload coverage artifact
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: ./coverage.xml
          if-no-files-found: error

  upload-coverage:
    name: Upload Coverage to Codecov
    needs: test-and-coverage
    runs-on: ubuntu-latest
    # Same-repo only. Fork PRs skip this job entirely (no OIDC token issuance).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # Codecov action OIDC token exchange — elevated permission scoped to this
      # same-repo upload job only (fork PRs never reach this job).
      id-token: write
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        # codecov/codecov-action@v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          use_oidc: true
          name: pytest
          fail_ci_if_error: true
          verbose: true
