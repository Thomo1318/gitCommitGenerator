name: CI / Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel superseded runs for the same PR/ref while keeping unique run_id fallback.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: hk validate & check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # hk check --pr diffs DEFAULT_BRANCH..HEAD; ensure origin/<base> exists under
      # persist-credentials: false (checkout does not keep a token for later fetches).
      - name: Fetch PR base branch for hk --pr
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # checkout has persist-credentials: false — use the job token for this fetch only.
          # github.* expressions are injected via env (not embedded in the shell script body).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git remote set-url origin "https://github.com/${REPO}.git"
          # hk --pr resolves DEFAULT_BRANCH (often bare "main"); create a local ref.
          if ! git show-ref --verify --quiet "refs/heads/${BASE_REF}"; then
            git branch --force "${BASE_REF}" "origin/${BASE_REF}"
          fi
          git rev-parse --verify "origin/${BASE_REF}"
          git rev-parse --verify "${BASE_REF}"

      - name: Install mise tools
        # jdx/mise-action@v4.2.1 — exact hk pin from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # ruff comes from the project env (used by hk steps).
        run: uv sync --all-extras --dev

      - name: hk validate
        run: hk validate

      - name: hk check (pull_request)
        if: github.event_name == 'pull_request'
        env:
          # Defence in depth: never run slow cov, secrets scanner, or mutating doc gens in CI lint.
          HK_SKIP_STEPS: pytest-cov,betterleaks,gen-docs,gen-toc
        run: >-
          hk check
          --check
          --no-stage
          --pr
          --fail-fast
          --no-progress

      - name: hk check (push / workflow_dispatch)
        if: github.event_name != 'pull_request'
        env:
          HK_SKIP_STEPS: pytest-cov,betterleaks,gen-docs,gen-toc
        # Do not use --pr alone on push/dispatch (can become a no-op delta).
        run: >-
          hk check
          --check
          --no-stage
          --all
          --fail-fast
          --no-progress

  test-and-coverage:
    name: Run Tests
    runs-on: ubuntu-latest
    # Tests only — no OIDC. Fork PR code never receives id-token: write.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: gold FP-budget guard (test_v11_a03) samples recent subjects.
          fetch-depth: 0
          persist-credentials: false

      # betterleaks is mandatory for live redaction probes and mirror scrub health.
      # Install only that tool (not the full mise toolset) so test runtime can invoke
      # `redact_payload` without mass-quarantining under the omission fail-safe.
      - name: Install betterleaks via mise
        # jdx/mise-action@v4.2.1 — same pin as lint; install_args limits to betterleaks.
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
          install_args: betterleaks

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Validate codecov.yml
        run: |
          set -euo pipefail
          # Codecov YAML validator (non-secret). Fail the job on invalid config.
          response="$(
            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              --data-binary @codecov.yml \
              https://codecov.io/validate
          )"
          printf '%s\n' "${response}"
          printf '%s\n' "${response}" | grep -qi 'Valid!'

      - name: Run Tests with Coverage
        run: >
          uv run pytest
          --cov=src/git_cg
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing:skip-covered

      - name: Upload coverage artifact
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: ./coverage.xml
          if-no-files-found: error


  docstring-coverage:
    name: Docstring Coverage (patch + badge)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Need merge-base history for accurate changed-file lists on PRs/pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # astral-sh/setup-uv@v9.0.0
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.14
        # interrogate MUST parse under 3.14 (PEP 758 bare multi-except).
        run: uv python install 3.14

      - name: Resolve changed src/git_cg Python files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p outputs/interrogate docs/assets/badges

          # Patch gate only — never hard-wire the whole package into the fail path.
          # Exclude legacy soak/dashboard tree (same as [tool.interrogate] exclude).
          # Use an explicit git pathspec glob so top-level modules (src/git_cg/*.py)
          # are included; plain '**' pathspecs omit them without :(glob).
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA}" ] \
            && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}...${HEAD_SHA}"
          else
            # workflow_dispatch / first push: compare against default branch tip when available.
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              RANGE="origin/main...HEAD"
            else
              RANGE="HEAD~1...HEAD"
            fi
          fi

          echo "Diff range: ${RANGE}"
          # Fail closed on invalid endpoints / ranges. Empty diffs still yield count=0.
          git rev-parse --verify "${RANGE%%...*}" >/dev/null
          git rev-parse --verify "${RANGE##*...}" >/dev/null
          # Capture git diff status separately from grep's "no matches" exit code.
          set +e
          git diff --name-only --diff-filter=ACMR "${RANGE}" -- \
            ':(glob)src/git_cg/**/*.py' \
            > outputs/interrogate/changed-files.raw
          diff_status=$?
          set -e
          if [ "${diff_status}" -ne 0 ]; then
            echo "git diff failed for range ${RANGE} (exit ${diff_status})" >&2
            exit "${diff_status}"
          fi
          # Newline-separated path list (no embedded NULs in the workflow file).
          grep -v '^src/git_cg/evals/' outputs/interrogate/changed-files.raw \
            | grep -v '^$' \
            > outputs/interrogate/changed-files.txt || true
          rm -f outputs/interrogate/changed-files.raw

          count="$(wc -l < outputs/interrogate/changed-files.txt | tr -d ' ')"
          {
            echo "range=${RANGE}"
            echo "count=${count}"
          } | tee outputs/interrogate/changed-summary.txt

          if [ "${count}" -eq 0 ]; then
            echo "No changed src/git_cg Python files — patch docstring gate skipped."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "count=0" >> "${GITHUB_OUTPUT}"
            echo "range=${RANGE}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Changed files (${count}):"
          sed 's/^/  /' outputs/interrogate/changed-files.txt
          {
            echo "skip=false"
            echo "count=${count}"
            echo "range=${RANGE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Patch gate — interrogate changed files only (fail-under 80)
        if: steps.changed.outputs.skip != 'true'
        env:
          CHANGED_RANGE: ${{ steps.changed.outputs.range }}
          CHANGED_COUNT: ${{ steps.changed.outputs.count }}
        run: |
          set -euo pipefail
          mapfile -t files < outputs/interrogate/changed-files.txt
          # Human report for the PR/push surface only (Codecov-style "what changed").
          # Pin interrogate for reproducible 3.14 parsing / badge output.
          set +e
          uvx --python 3.14 --from "interrogate==1.7.0" interrogate -vv --fail-under 80 "${files[@]}" \
            | tee outputs/interrogate/patch-report.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "mode=patch"
            echo "range=${CHANGED_RANGE}"
            echo "file_count=${CHANGED_COUNT}"
            echo "fail_under=80"
            echo "exit=${status}"
          } | tee outputs/interrogate/patch-summary.txt
          exit "${status}"

      - name: Full-package badge scan (informational; does not gate)
        if: always()
        run: |
          set -euo pipefail
          # README badge reflects whole-package health, not the patch subset.
          # fail-under 0 so a low global % never fails CI; the patch step is the gate.
          set +e
          uvx --python 3.14 --from "interrogate==1.7.0" interrogate src/git_cg -v --fail-under 0 \
            --generate-badge docs/assets/badges \
            --badge-format svg \
            --badge-style flat \
            | tee outputs/interrogate/full-report.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "mode=full-package-badge"
            echo "fail_under=0"
            echo "badge=docs/assets/badges/interrogate_badge.svg"
            echo "exit=${status}"
          } | tee outputs/interrogate/full-summary.txt
          # Badge generation failure should not hide a patch-gate result, but still surface.
          exit "${status}"

      - name: Upload interrogate report artifact
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: interrogate-docstring-report
          path: |
            outputs/interrogate/
            docs/assets/badges/interrogate_badge.svg
          if-no-files-found: warn

      # Unprivileged PR-only staging. The privileged poster lives in
      # pr-docstring-comment.yml and treats every artifact byte as untrusted.
      - name: Stage sticky PR docstring comment artifact
        if: always() && github.event_name == 'pull_request'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/interrogate-pr-comment
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SKIP_PATCH: ${{ steps.changed.outputs.skip }}
          PATCH_COUNT: ${{ steps.changed.outputs.count }}
          PATCH_RANGE: ${{ steps.changed.outputs.range }}
        run: |
          set -euo pipefail
          rm -rf -- "${ARTIFACT_DIR}"
          mkdir -p -- "${ARTIFACT_DIR}"

          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          RESULT_RE = re.compile(
              r"RESULT:\s*(PASSED|FAILED)\s*\(minimum:\s*([0-9.]+)%,\s*actual:\s*([0-9.]+)%\)",
              re.IGNORECASE,
          )
          SUMMARY_ROW_RE = re.compile(
              r"^\|\s*([^|]+?)\s*\|\s*([0-9]+)\s*\|\s*([0-9]+)\s*\|\s*([0-9]+)\s*\|\s*([0-9.]+)%\s*\|$"
          )
          MAX_FILES = 40
          MAX_SUMMARY_ROWS = 12
          MAX_COMMENT_BYTES = 55_000
          # Keep the sticky comment summary-first; verbose -vv lives under <details>.
          MAX_VERBOSE_CHARS = 24_000


          def scrub(text: str) -> str:
              text = text.replace("\r\n", "\n").replace("\r", "\n")
              text = "".join(
                  ch for ch in text if (ord(ch) >= 32 or ch in "\n\t") and ch != "\x7f"
              )
              # Neutralize mentions and accidental HTML comment breakouts.
              return text.replace("@", "&#64;").replace("<!--", "&lt;!--").replace("-->", "--&gt;")


          def parse_result(report: str) -> tuple[str, str, str] | None:
              matches = list(RESULT_RE.finditer(report))
              if not matches:
                  return None
              m = matches[-1]
              return m.group(1).upper(), m.group(2), m.group(3)


          def parse_summary_rows(report: str) -> list[tuple[str, str, str, str, str]]:
              rows: list[tuple[str, str, str, str, str]] = []
              for line in report.splitlines():
                  m = SUMMARY_ROW_RE.match(line.strip())
                  if not m:
                      continue
                  name = m.group(1).strip()
                  if name.lower() in {"name", "-----"}:
                      continue
                  rows.append(
                      (
                          scrub(name),
                          m.group(2),
                          m.group(3),
                          m.group(4),
                          m.group(5),
                      )
                  )
              # Keep TOTAL last if present; otherwise keep first N.
              total = [r for r in rows if r[0].upper() == "TOTAL"]
              body = [r for r in rows if r[0].upper() != "TOTAL"]
              body = body[:MAX_SUMMARY_ROWS]
              return body + total[-1:]


          def extract_detailed_coverage(report: str) -> str:
              """Return the interrogate -vv detailed block when present."""
              if not report.strip():
                  return ""
              lines = report.replace("\r\n", "\n").replace("\r", "\n").splitlines()
              start = None
              end = None
              for idx, line in enumerate(lines):
                  stripped = line.strip()
                  if start is None and "Detailed Coverage" in stripped:
                      start = idx
                      continue
                  if start is not None and stripped.startswith("-----") and "Summary" in stripped:
                      end = idx
                      break
              if start is None:
                  # Fallback: whole report (still size-capped by caller).
                  body = "\n".join(lines).strip()
              else:
                  body = "\n".join(lines[start:end]).strip() if end is not None else "\n".join(lines[start:]).strip()
              return body


          # interrogate -vv rows look like:
          # | ParseResult.to_dict (L86)   |        MISSED |
          DETAIL_ROW_RE = re.compile(
              r"^\|\s*(?P<name>.+?)\s*\|\s*(?P<status>COVERED|MISSED)\s*\|\s*$",
              re.IGNORECASE,
          )
          MAX_MISSED_ROWS = 80


          def parse_missed_rows(report: str) -> list[tuple[str, str]]:
              """Extract (symbol, location) pairs for MISSED rows from -vv output."""
              detail = extract_detailed_coverage(report)
              if not detail:
                  return []
              missed: list[tuple[str, str]] = []
              for line in detail.splitlines():
                  m = DETAIL_ROW_RE.match(line.strip())
                  if not m:
                      continue
                  if m.group("status").upper() != "MISSED":
                      continue
                  raw_name = scrub(m.group("name").strip())
                  # Split trailing "(L123)" location when present.
                  loc_match = re.search(r"\s*\((L\d+)\)\s*$", raw_name)
                  if loc_match:
                      location = loc_match.group(1)
                      symbol = raw_name[: loc_match.start()].strip()
                  else:
                      symbol = raw_name
                      location = "—"
                  if not symbol or symbol.lower() == "name":
                      continue
                  missed.append((symbol, location))
              return missed[:MAX_MISSED_ROWS]


          def md_missed_table(rows: list[tuple[str, str]]) -> str:
              if not rows:
                  return "_No MISSED symbols in the patch gate report._"
              lines = [
                  "| Symbol | Location |",
                  "| --- | --- |",
              ]
              for symbol, location in rows:
                  lines.append(f"| `{symbol}` | `{location}` |")
              return "\n".join(lines)


          def format_missed_section(report: str, *, skipped: bool) -> list[str]:
              """Always-visible MISSED-symbol summary for the sticky PR comment."""
              if skipped:
                  return [
                      "### MISSED symbols (patch gate)",
                      "",
                      "_Patch gate skipped — no changed `src/git_cg` Python files._",
                  ]
              if not report.strip():
                  return [
                      "### MISSED symbols (patch gate)",
                      "",
                      "_Verbose patch report unavailable._",
                  ]
              missed_rows = parse_missed_rows(report)
              note = ""
              # parse_missed_rows already caps; surface that when we hit the ceiling.
              missed_total = 0
              detail = extract_detailed_coverage(report)
              if detail:
                  for line in detail.splitlines():
                      m = DETAIL_ROW_RE.match(line.strip())
                      if m and m.group("status").upper() == "MISSED":
                          missed_total += 1
              if missed_total > MAX_MISSED_ROWS:
                  note = (
                      f"\n\n_Showing first {MAX_MISSED_ROWS} of {missed_total} MISSED symbols. "
                      "See the verbose detail or `interrogate-docstring-report` artifact for the full list._"
                  )
              return [
                  "### MISSED symbols (patch gate)",
                  "",
                  md_missed_table(missed_rows) + note,
              ]


          def format_verbose_details(report: str, *, skipped: bool) -> list[str]:
              """Collapsible -vv ASCII dump for the sticky PR comment."""
              if skipped:
                  return [
                      "<details>",
                      "<summary>Patch verbose detail (-vv)</summary>",
                      "",
                      "_Patch gate skipped — no changed `src/git_cg` Python files._",
                      "",
                      "</details>",
                  ]
              detail = extract_detailed_coverage(report)
              if not detail:
                  return [
                      "<details>",
                      "<summary>Patch verbose detail (-vv)</summary>",
                      "",
                      "_Verbose patch report unavailable._",
                      "",
                      "</details>",
                  ]
              truncated = False
              if len(detail) > MAX_VERBOSE_CHARS:
                  detail = detail[:MAX_VERBOSE_CHARS].rstrip()
                  truncated = True
              detail = scrub(detail)
              # Fence as plain text so table pipes render literally.
              block = [
                  "<details>",
                  "<summary>Patch verbose detail (-vv)</summary>",
                  "",
                  "```text",
                  detail,
                  "```",
              ]
              if truncated:
                  block.extend(
                      [
                          "",
                          "_…verbose detail truncated for comment size limits. "
                          "Full `-vv` output is in the `interrogate-docstring-report` artifact._",
                      ]
                  )
              block.extend(["", "</details>"])
              return block


          def status_emoji(status: str | None, *, skipped: bool = False) -> str:
              if skipped:
                  return "⏭️"
              if status == "PASSED":
                  return "✅"
              if status == "FAILED":
                  return "❌"
              return "⚠️"


          def md_table(rows: list[tuple[str, str, str, str, str]]) -> str:
              if not rows:
                  return "_No summary rows parsed._"
              lines = [
                  "| Name | Total | Miss | Cover | Cover% |",
                  "| --- | ---: | ---: | ---: | ---: |",
              ]
              for name, total, miss, cover, pct in rows:
                  lines.append(f"| `{name}` | {total} | {miss} | {cover} | {pct}% |")
              return "\n".join(lines)


          out_dir = Path("outputs/interrogate")
          patch_report_path = out_dir / "patch-report.txt"
          full_report_path = out_dir / "full-report.txt"
          changed_path = out_dir / "changed-files.txt"

          skip_patch = os.environ.get("SKIP_PATCH", "false").lower() == "true"
          patch_count = os.environ.get("PATCH_COUNT", "0")
          patch_range = scrub(os.environ.get("PATCH_RANGE", "unknown"))
          head_sha = scrub(os.environ.get("HEAD_SHA", ""))
          run_url = scrub(os.environ.get("RUN_URL", ""))
          pr_number = os.environ["PR_NUMBER"]

          patch_report = (
              patch_report_path.read_text(encoding="utf-8", errors="replace")
              if patch_report_path.is_file()
              else ""
          )
          full_report = (
              full_report_path.read_text(encoding="utf-8", errors="replace")
              if full_report_path.is_file()
              else ""
          )
          changed_files = []
          if changed_path.is_file():
              changed_files = [
                  scrub(line.strip())
                  for line in changed_path.read_text(encoding="utf-8", errors="replace").splitlines()
                  if line.strip()
              ]

          patch_parsed = None if skip_patch else parse_result(patch_report)
          full_parsed = parse_result(full_report)
          patch_rows = [] if skip_patch else parse_summary_rows(patch_report)
          full_rows = parse_summary_rows(full_report)

          if skip_patch:
              patch_line = f"{status_emoji(None, skipped=True)} **Patch gate:** skipped (no changed `src/git_cg` Python files)"
          elif patch_parsed:
              st, minimum, actual = patch_parsed
              patch_line = (
                  f"{status_emoji(st)} **Patch gate:** `{st}` "
                  f"(minimum: {minimum}%, actual: **{actual}%**, files: {patch_count})"
              )
          else:
              patch_line = f"{status_emoji(None)} **Patch gate:** report unavailable (files: {patch_count})"

          if full_parsed:
              st, minimum, actual = full_parsed
              full_line = (
                  f"{status_emoji(st)} **Full package:** `{st}` "
                  f"(informational minimum: {minimum}%, actual: **{actual}%**)"
              )
          else:
              full_line = f"{status_emoji(None)} **Full package:** report unavailable"

          files_block: list[str]
          if not changed_files:
              files_block = ["_None_"]
          else:
              shown = changed_files[:MAX_FILES]
              files_block = [f"- `{path}`" for path in shown]
              remaining = len(changed_files) - len(shown)
              if remaining > 0:
                  files_block.append(f"- _…and {remaining} more_")

          short_sha = head_sha[:12] if head_sha else "unknown"
          lines = [
              "## interrogate docstring coverage",
              "",
              patch_line,
              full_line,
              "",
              f"- **Diff range:** `{patch_range}`",
              f"- **Analyzed SHA:** `{short_sha}`",
              f"- **CI run:** [workflow run]({run_url})" if run_url else "- **CI run:** unavailable",
              "",
              "### Changed files (patch gate)",
              "",
              *files_block,
              "",
              "### Patch summary",
              "",
              md_table(patch_rows) if not skip_patch else "_Patch gate skipped._",
              "",
              "### Full-package summary",
              "",
              md_table(full_rows),
              "",
              *format_missed_section(patch_report, skipped=skip_patch),
              "",
              *format_verbose_details(patch_report, skipped=skip_patch),
              "",
              "---",
              "",
              "*Docstring coverage via [interrogate](https://github.com/econchick/interrogate). "
              "Patch gate fails under 80% on changed `src/git_cg` files; full-package scan is informational. "
              "MISSED symbols are listed above; expand **Patch verbose detail (-vv)** for the full ASCII report.*",
              "",
          ]
          body = "\n".join(lines)
          body = scrub(body)
          # Ensure required heading survives scrub.
          if not body.startswith("## interrogate docstring coverage\n"):
              raise SystemExit("generated comment missing required heading")
          if "*Docstring coverage via [interrogate]" not in body:
              raise SystemExit("generated comment missing required footer")

          data = body.encode("utf-8")
          if len(data) > MAX_COMMENT_BYTES:
              # Last-resort truncation while preserving heading + footer.
              footer = (
                  "\n\n---\n\n*Docstring coverage via [interrogate]"
                  "(https://github.com/econchick/interrogate). "
                  "Patch gate fails under 80% on changed `src/git_cg` files; "
                  "full-package scan is informational.*\n"
              )
              keep = MAX_COMMENT_BYTES - len(footer.encode("utf-8")) - 80
              truncated = data[:keep].decode("utf-8", errors="ignore").rstrip()
              body = (
                  truncated
                  + "\n\n_…report truncated for comment size limits._"
                  + footer
              )
              if not body.startswith("## interrogate docstring coverage\n"):
                  raise SystemExit("truncated comment lost required heading")
              data = body.encode("utf-8")

          artifact = Path(os.environ["ARTIFACT_DIR"])
          (artifact / "interrogate-comment.md").write_bytes(data)
          (artifact / "pr-number.txt").write_text(f"{int(pr_number)}\n", encoding="ascii")
          print(f"staged sticky interrogate comment ({len(data)} bytes) for PR #{int(pr_number)}")
          PY

      - name: Upload sticky PR docstring comment artifact
        if: always() && github.event_name == 'pull_request'
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: interrogate-pr-comment
          path: ${{ runner.temp }}/interrogate-pr-comment/
          if-no-files-found: warn
          retention-days: 1


  upload-coverage:
    name: Upload Coverage to Codecov
    needs: test-and-coverage
    runs-on: ubuntu-latest
    # Same-repo only. Fork PRs skip this job entirely (no OIDC token issuance).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # Codecov action OIDC token exchange — elevated permission scoped to this
      # same-repo upload job only (fork PRs never reach this job).
      id-token: write
    steps:
      - name: Checkout repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifact
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        # codecov/codecov-action@v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          use_oidc: true
          name: pytest
          fail_ci_if_error: true
          verbose: true
